name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: |
          if go list -deps ./... | grep -v '^github.com/k8sstormcenter/sbob-go' | grep -q '\.'; then
            echo "third-party dependency found"; exit 1
          fi
  tinygo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25"
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3
        with:
          tinygo-version: "0.39.0"
      - run: tinygo build -target=wasip1 -o /dev/null ./cmd/wasmcheck
